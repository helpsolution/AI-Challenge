spring:
  application:
    name: day10
  # Локально ключ удобно держать в .env рядом с проектом (файл в .gitignore).
  # На сервере тот же ключ приходит обычной переменной окружения.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      # Поток запроса ждёт ответа модели секунды, а прогон сценария — минуты.
      # Виртуальный поток на такое ожидание ничего не стоит.
      enabled: true
  sql:
    init:
      # schema.sql идемпотентна, поэтому гоняем её на каждом старте: схема есть всегда,
      # а прогоны из прошлых запусков остаются на месте.
      mode: always

server:
  port: ${PORT:8089}

chat:
  # Не внутри build/: иначе ./gradlew clean уносил бы все прогоны вместе с замерами.
  db-path: ${DB_PATH:./data/day10.db}

llm:
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    connect-timeout: 10s
    # Граница ожидания ответа: без неё повисший запрос держал бы прогон сценария навсегда.
    read-timeout: 180s
    # Прайс в долларах за миллион токенов: DeepSeek стоимость запроса не сообщает,
    # а сравнивать стратегии без денег бессмысленно.
    #
    # Ставки взяты с https://api-docs.deepseek.com/quick_start/pricing и указаны ПИКОВЫЕ —
    # вне пиковых часов (01:00–04:00 и 06:00–10:00 UTC, пн–пт) тариф ровно вдвое ниже.
    # То есть цена в интерфейсе — оценка сверху, и она так и помечена. Нули означают
    # «прайс не задан»: тогда цена не показывается вовсе.
    #
    # Разница между двумя входными ставками — тридцатикратная, и это не мелочь для этого
    # дня: стратегия, которая каждый ход перекраивает начало промпта, ломает кэш префикса
    # и платит полную ставку за тот же текст.
    prices:
      input-cache-hit: 0.014
      input-cache-miss: 0.44
      output: 1.32

agent:
  name: Барсик

  model: ${AGENT_MODEL:deepseek-chat}
  # Лимит контекста модели. Провайдер его в ответе не сообщает, взять больше негде.
  # Здесь он нужен не для защиты — упереться в миллион руками невозможно, — а чтобы
  # показывать, какую долю доступного контекста стратегия на самом деле использует.
  context-limit: ${AGENT_CONTEXT_LIMIT:1000000}
  max-tokens: 1024
  # Ниже, чем в прошлые дни: сравнение стратегий должно мерить память, а не разброс
  # формулировок. Ноль не ставим — на нуле модель начинает отвечать заученными шаблонами.
  temperature: ${AGENT_TEMPERATURE:0.3}

  context:
    # Значения по умолчанию для НОВОЙ сессии. Работающая сессия читает стратегию и окно
    # из своей записи в базе: правка этого файла не должна задним числом переписывать
    # условия прогонов, которые уже сделаны.
    strategy: ${AGENT_STRATEGY:SLIDING_WINDOW}

    # ГЛАВНЫЙ ПАРАМЕТР ДНЯ. Четыре сообщения — это две пары «вопрос-ответ».
    #
    # Число намеренно маленькое. У deepseek-chat контекст 1 000 000 токенов, и при
    # просторном окне на сценарии из пятнадцати реплик ни одна стратегия ничего
    # не потеряет — сравнивать будет нечего. Тесное окно не подгоняет результат,
    # а делает эксперимент возможным: иначе замер показывает не свойства стратегии,
    # а размер контекста модели.
    #
    # Четыре, а не шесть: на шести скользящее окно удерживало две проверки из восьми
    # и выглядело «почти работающим». На четырёх разница между стратегиями перестаёт
    # быть вопросом везения.
    window-size: ${AGENT_WINDOW_SIZE:4}

    # Досье стратегии FACTS: короткие записи «ключ — значение», выжатые из реплик
    # пользователя. Уходят модели целиком на каждом ходу вместе с тем же тесным окном.
    facts:
      # Потолок досье — единственное, что мешает стратегии выродиться в «отправляем всё».
      # Без него досье растёт вместе с разговором, только медленнее, и на длинной
      # дистанции приходит туда же, откуда мы уходили.
      max-facts: ${AGENT_MAX_FACTS:25}
      max-value-chars: 200
      # Потолок ответа извлекателя. Досье в 25 записей по 200 символов — это около
      # 350 токенов; 512 хватает с запасом даже когда обновляется половина сразу.
      max-tokens: 512
      # Пусто — извлекаем той же моделью, что отвечает пользователю. Отдельная модель —
      # осознанный выбор, а не умолчание: разные модели дают разные досье, и прогоны
      # переставали бы быть сравнимыми.
      model: ${AGENT_FACTS_MODEL:}

  # Персона нарочно деловая, а не кошачья, как в прошлые дни: сценарий этого дня —
  # сбор ТЗ, и характер в ответах мешал бы читать, что именно агент помнит.
  #
  # Отдельно оговорено «не додумывай»: половина проверок сценария ловит не забывание,
  # а выдумывание. Агент, потерявший начало разговора, редко говорит «не помню» — чаще
  # он уверенно достраивает правдоподобное. Без этой строки мы мерили бы не память,
  # а склонность модели фантазировать.
  persona: >
    Ты Барсик — аналитик, который помогает собрать техническое задание.
    Отвечай по-русски, коротко и по делу, без воды и без списков там, где хватит фразы.
    Опирайся только на то, что прозвучало в этом разговоре: имена, числа, сроки,
    принятые решения и явные отказы.
    Если чего-то в разговоре не было или ты этого не помнишь — так и скажи прямо.
    Не додумывай детали, которых тебе не называли, даже если они выглядят очевидными.

logging:
  level:
    # DEBUG показывает внутрянку хода: что пришло агенту на вход, из каких блоков стратегия
    # собрала промпт (целиком) и что вернула модель. В этот день дамп промпта — не роскошь:
    # по нему видно, какие именно сообщения окно выбросило.
    # Поставьте INFO, если нужна только сводка в две строки на ход.
    advent.day10: DEBUG
    # Поменяйте здесь DEBUG на TRACE — и в лог добавятся сырые JSON запроса и ответа,
    # то есть то, что буквально ушло в сеть. Ключа в них нет: он передаётся заголовком,
    # а заголовки не логируются никогда.
    advent.day10.llm.DeepSeekClient: TRACE
