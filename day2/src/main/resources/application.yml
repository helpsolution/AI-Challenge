spring:
  application:
    name: day2
  # Локально ключ удобно держать в .env рядом с проектом (файл в .gitignore).
  # На сервере тот же ключ приходит обычной переменной окружения.
  config:
    import: optional:file:.env[.properties]

server:
  port: ${PORT:8081}

llm:
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    default-model: ${DEEPSEEK_MODEL:deepseek-chat}
    allowed-models:
      - deepseek-chat
      - deepseek-reasoner
    connect-timeout: 10s
    read-timeout: 120s

logging:
  level:
    advent.day2: INFO
