spring:
  application:
    name: day31-developer-assistant
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
project:
  root: ${PROJECT_ROOT:..}
  mcp-url: ${PROJECT_MCP_URL:http://127.0.0.1:8312/mcp}
cloud-llm:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  temperature: 0.1
  timeout: 120s
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  timeout: 90s
  document-prefix: "search_document: "
  query-prefix: "search_query: "
knowledge:
  index-file: data/index/knowledge.db
  target-chars: 1400
  max-chars: 2200
reranker:
  base-url: ${RERANKER_BASE_URL:http://127.0.0.1:8012}
  timeout: 120s
server:
  address: 127.0.0.1
  port: ${PORT:8311}
