spring:
  application:
    name: day27-studio
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # Ответ идёт стримом; холодный старт модели и большой дифф укладываются с запасом.
      request-timeout: 5m

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2:3b}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8280}
