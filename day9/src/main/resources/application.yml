spring:
  application:
    name: day9
  # Локально ключи удобно держать в .env рядом с проектом (файл в .gitignore).
  # На сервере те же ключи приходят обычными переменными окружения.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      # Поток запроса ждёт ответа модели секунды — виртуальный поток на такое
      # ожидание ничего не стоит.
      enabled: true
  sql:
    init:
      # schema.sql идемпотентна, поэтому гоняем её на каждом старте: схема есть всегда,
      # а данные из прошлых запусков остаются на месте.
      mode: always

server:
  port: ${PORT:8088}

chat:
  # Не внутри build/: иначе ./gradlew clean уносил бы и переписку, и весь измеренный расход.
  #
  # Имя файла зависит от режима намеренно. Сравнивать надо два прогона целиком, поэтому
  # у каждого режима своя база: в одной истории, где половина ходов прошла со сжатием,
  # а половина без, вывод о качестве ответов было бы не на чем строить.
  #
  #   AGENT_CONTEXT_MODE=RAW     DB_PATH=./data/day9-raw.db      ./gradlew bootRun
  #   AGENT_CONTEXT_MODE=SUMMARY DB_PATH=./data/day9-summary.db  ./gradlew bootRun
  db-path: ${DB_PATH:./data/day9-summary.db}

llm:
  # Кто обслуживает агента: DEEPSEEK или OPENROUTER. Меняется вместе с agent.model
  # и agent.context-limit — три строки, которые надо править согласованно.
  provider: ${LLM_PROVIDER:DEEPSEEK}

  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    connect-timeout: 10s
    # Граница ожидания ответа: без неё повисший запрос держал бы запрос браузера навсегда.
    read-timeout: 180s
    # Прайс в долларах за миллион токенов: DeepSeek, в отличие от OpenRouter, стоимость
    # запроса не сообщает, а сравнивать расход надо в деньгах тоже.
    #
    # Ставки взяты с https://api-docs.deepseek.com/quick_start/pricing и указаны ПИКОВЫЕ —
    # вне пиковых часов (01:00–04:00 и 06:00–10:00 UTC, пн–пт) тариф ровно вдвое ниже.
    # То есть цена на DeepSeek — оценка сверху, и в интерфейсе она так и помечена.
    #
    # ВАЖНО ДЛЯ ЭТОГО ДНЯ: разница между двумя первыми ставками — тридцатикратная,
    # и она объясняет, почему экономия в токенах не равна экономии в деньгах. Полная
    # история уходит одним и тем же префиксом каждый ход и потому попадает в кэш
    # провайдера. Каждый новый конспект этот префикс ломает: он вставляется в начало
    # промпта, и всё, что за ним, для кэша становится новым текстом.
    prices:
      input-cache-hit: 0.014
      input-cache-miss: 0.44
      output: 1.32

  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    referer: ${OPENROUTER_REFERER:https://github.com/helpsolution/AI-Challenge}
    title: AI Advent Challenge day 9
    # Сжатие контекста силами агрегатора. Держим выключенным: в этот день сжатием
    # занимаемся мы сами, и чужое молчаливое урезание середины истории смешало бы
    # два разных явления в одном графике.
    #
    # false — промпт уходит как есть, и переполнение честно падает с 400:
    #   «This endpoint's maximum context length is 4095 tokens. However, you requested
    #    about 21250 tokens (21190 of text input, 60 in the output).»
    #
    # Для моделей с контекстом 8K и меньше OpenRouter включает сжатие по умолчанию,
    # поэтому мы задаём это поле всегда явно, в обе стороны.
    context-compression: ${OPENROUTER_CONTEXT_COMPRESSION:false}
    connect-timeout: 10s
    read-timeout: 180s

agent:
  name: Барсик

  # Модель и её лимит контекста меняются вместе с llm.provider. Готовые пары:
  #
  #   DEEPSEEK   + deepseek-chat             + 1000000   — штатный стенд этого дня:
  #                                                        лимит не мешает, и сравнение
  #                                                        получается про качество и деньги,
  #                                                        а не про аварию
  #   OPENROUTER + openai/gpt-3.5-turbo-0613 + 4095      — стенд дня 8: RAW упирается
  #                                                        в лимит ходов через десять,
  #                                                        SUMMARY продолжает разговор
  #   OPENROUTER + microsoft/phi-4           + 16384     — то же, но контекст побольше
  #
  # Лимит провайдер в ответе не сообщает, взять его больше негде — только из прайса
  # и документации модели.
  model: ${AGENT_MODEL:deepseek-chat}
  context-limit: ${AGENT_CONTEXT_LIMIT:1000000}

  # Потолок ответа съедает часть контекста ещё до того, как модель что-то сказала:
  # лимит считается вместе с ответом.
  max-tokens: 512
  temperature: 0.8

  # ГЛАВНЫЙ ПЕРЕКЛЮЧАТЕЛЬ ДНЯ.
  context:
    # RAW     — вся переписка уходит модели дословно, как в дне 8. Запрос растёт каждый ход.
    # SUMMARY — дословно только последние keep-last сообщений, остальное одним конспектом.
    #
    # Это не «включить/выключить фичу», а два прогона эксперимента. Первый нужен ровно
    # затем, чтобы второму было с чем сравниваться.
    mode: ${AGENT_CONTEXT_MODE:SUMMARY}

    # Сколько последних сообщений всегда уходят дословно. Три пары «вопрос-ответ»:
    # меньше — и модель теряет нитку текущего разговора, больше — и хвост начинает
    # заметно весить сам по себе.
    keep-last: 6

    # Размер пачки, которая сворачивается за раз. Задание предлагает 10 — берём 10.
    # Число задаёт и частоту расходов на сжатие: одно обращение к модели на пять ходов.
    summarize-every: 10

    # Потолок конспекта. Он же единственная жёсткая граница его размера: просьба
    # «уложись в столько-то символов» в инструкции — просьба, а max_tokens — предел.
    #
    # Было 300 — и этого не хватило: на втором сворачивании конспект оборвался ровно
    # на фразе о перенесённой дате релиза, и агент честно ответил, что даты в разговоре
    # не было. Причина в том, что в пачку из 10 сообщений попадают развёрнутые ответы
    # модели, а конспект обязан вместить ещё и предыдущую свою версию.
    #
    # Если конспект снова начнёт обрываться на полуслове, в логе появится предупреждение,
    # а сам обрубок будет докачен до конца последней целой фразы.
    summary-max-tokens: 600

    # Модель для сворачивания. Пусто — та же, что отвечает пользователю.
    # Отдельная модель здесь имеет смысл: конспект — задача проще ответа, и на ней
    # можно экономить дважды.
    summary-model: ${AGENT_SUMMARY_MODEL:}

  persona: >
    Ты кот по имени Барсик. Ты живёшь в этом чате и помогаешь людям: отвечаешь по делу,
    по-русски, коротко и точно.
    Ты помнишь весь разговор: если раньше уже прозвучали имена, факты или предпочтения
    собеседника — опирайся на них и не переспрашивай заново.
    Характер кошачий: независимый, слегка ироничный, ценишь тишину, тепло и рыбу.
    Кошачьего колорита — ровно щепотка: одна фраза или сравнение на ответ, не больше.
    Смысл ответа важнее образа. Если вопрос неясен, задай один уточняющий вопрос.

logging:
  level:
    # DEBUG показывает внутрянку хода: что пришло агенту на вход, из каких блоков собран
    # промпт (целиком), что вернула модель, во сколько токенов и денег это обошлось —
    # и текст каждого нового конспекта. Последнее для этого дня главное: числа скажут,
    # что промпт стал короче, но не скажут, потерялось ли в нём имя собеседника.
    # Поставьте INFO, если нужна только сводка в две строки на ход.
    advent.day9: DEBUG
    # Поменяйте здесь DEBUG на TRACE — и в лог добавятся сырые JSON запроса и ответа,
    # то есть то, что буквально ушло в сеть. Ключа в них нет: он передаётся заголовком,
    # а заголовки не логируются никогда.
    advent.day9.llm.DeepSeekClient: DEBUG
    advent.day9.llm.OpenRouterClient: DEBUG
