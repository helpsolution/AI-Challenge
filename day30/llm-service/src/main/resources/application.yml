spring:
  application:
    name: day30-llm-service
  threads:
    virtual:
      enabled: true

server:
  # На VPS наружу смотрит только Caddy с HTTPS, сервис слушает localhost.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8310}

llm:
  ollama-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${LLM_MODEL:gemma3:1b}
  # Окно контекста в токенах. Запрос длиннее окна получает 400, а не обрезается молча.
  context-tokens: ${LLM_CONTEXT_TOKENS:2048}
  # Потолок ответа: больший max_tokens от клиента урезается до него.
  max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:512}
  # Ключи доступа «имя:ключ» через запятую. Имя видно в журнале, лимит запросов у каждого ключа свой.
  api-keys: ${API_KEYS:}
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:10}
    window: ${RATE_LIMIT_WINDOW:1m}
  queue:
    # Сколько ответов генерируется одновременно. На одном ядре больше одного не ускоряет, а память удваивает.
    parallel: ${QUEUE_PARALLEL:1}
    # Сколько запросов ждут своей очереди. Следующий получает 503 сразу.
    max-waiting: ${QUEUE_MAX_WAITING:3}
