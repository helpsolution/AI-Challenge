# /etc/systemd/system/ollama.service.d/override.conf
# Ollama слушает только 127.0.0.1:11434 (по умолчанию) — снаружи до неё не достучаться, только через сервис.
[Service]
# Одна модель в памяти и одна генерация за раз: на 1 ядре и 2 ГБ больше не помещается.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# Модель не выгружается между запросами: холодная загрузка с диска — 2–5 с.
Environment="OLLAMA_KEEP_ALIVE=-1"
# То же окно, что шлёт сервис, — для запросов в обход него (ollama run на сервере).
Environment="OLLAMA_CONTEXT_LENGTH=2048"
