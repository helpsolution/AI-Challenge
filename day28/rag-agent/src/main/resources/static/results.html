<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замеры — день 28</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/system.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
  body { background: #fff; }
  .nav { position: sticky; top: 0; z-index: 3; min-height: 64px; }
  .page { max-width: 1320px; margin-inline: auto; padding: 24px 24px 48px; }
  .heading h1 { font-size: 26px; font-weight: 600; letter-spacing: -.6px; margin: 4px 0 6px; }
  .heading p { margin: 0; color: var(--color-text-secondary); font-size: 14px; }

  .models { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .model-card { border: 1px solid var(--color-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .model-card[data-provider="cloud"] { background: #fbfcfe; }
  .model-head { display: flex; align-items: center; gap: 8px; }
  .provider { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  .provider[data-provider="local"] { color: var(--color-success); background: var(--color-success-soft); }
  .provider[data-provider="cloud"] { color: var(--color-info); background: var(--color-info-soft); }
  .model-name { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }

  .criterion { border-top: 1px solid var(--color-border); padding-top: 12px; display: grid; grid-template-columns: 112px 1fr; gap: 4px 12px; align-items: baseline; }
  .criterion-name { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--color-text-muted); }
  .criterion-main { font-family: var(--font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .criterion-main small { font-size: 13px; color: var(--color-text-secondary); font-weight: 500; margin-left: 6px; font-family: var(--font-body); }
  .criterion-lines { grid-column: 2; font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.6; }
  .criterion-lines b { font-family: var(--font-mono); font-weight: 600; color: var(--color-text-primary); }

  .retrieval { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border: 1px dashed var(--color-border-strong); border-radius: 12px; font-size: 12.5px; color: var(--color-text-secondary); }
  .retrieval b { font-family: var(--font-mono); color: var(--color-text-primary); }
  .retrieval .local-mark { color: var(--color-success); font-weight: 600; }

  .matrix-scroll { overflow-x: auto; }
  .matrix { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px; }
  .matrix th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--color-text-muted); padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
  .matrix td { padding: 9px 10px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
  .matrix tr.q-row { cursor: pointer; }
  .matrix tr.q-row:hover td { background: #f8f9fc; }
  .q-id { font-family: var(--font-mono); color: var(--color-text-muted); width: 72px; }
  .q-text { max-width: 420px; }
  .q-expect { font-size: 11px; color: var(--color-text-muted); }
  .cell { white-space: nowrap; }
  .dots { display: inline-flex; gap: 3px; margin-right: 8px; vertical-align: middle; }
  .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .dot[data-s="answered"] { background: var(--color-success); }
  .dot[data-s="no_answer"], .dot[data-s="weak_context"] { background: #C3CAD6; }
  .dot[data-s="unverified"] { background: #D9A400; }
  .dot[data-s="failed"] { background: var(--color-danger); }
  .cell-time { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--color-text-secondary); }
  .legend .dot { margin-right: 5px; vertical-align: -1px; }

  .details td { background: #fafbfd; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .detail { border: 1px solid var(--color-border); border-radius: 12px; padding: 12px; background: #fff; display: flex; flex-direction: column; gap: 6px; }
  .detail-text { white-space: pre-wrap; line-height: 1.55; font-size: 12.5px; }
  .detail-reason { font-size: 11.5px; color: var(--color-text-muted); }
  .draft { white-space: pre-wrap; font-size: 12px; padding: 6px 10px; border-left: 3px solid var(--color-warning); background: var(--color-warning-soft); border-radius: 0 8px 8px 0; }
  .expectation { font-size: 12.5px; padding: 8px 12px; border-left: 3px solid var(--color-info); background: var(--color-info-soft); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
  .run-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .verdict { font-size: 11px; font-weight: 600; }
  .verdict[data-v="correct"] { color: var(--color-success); }
  .verdict[data-v="partial"] { color: var(--color-warning); }
  .verdict[data-v="wrong"] { color: var(--color-danger); }
</style>
</head>
<body>
<div id="app" v-cloak>
  <header class="nav">
    <div class="nav-brand">
      <span class="nav-mark">L</span>
      <span>Локальный RAG</span>
      <span class="t-body-sm t-muted">день 28</span>
    </div>
    <nav class="tabs" aria-label="Разделы">
      <a class="tab" href="/">Сравнение</a>
      <a class="tab" href="/results.html" aria-selected="true">Замеры</a>
      <a class="tab" href="/inside.html">Внутри агента</a>
    </nav>
    <div class="nav-spacer"></div>
  </header>

  <main class="page stack stack-lg">
    <div class="heading">
      <div class="t-label-sm t-secondary">tools/eval_compare.py</div>
      <h1>Локальные модели против облака</h1>
      <p v-if="report">{{ report.questions.length }} вопросов × {{ report.runs }} прогона, одинаковый контекст для всех моделей · {{ dateTime(report.at) }}</p>
    </div>

    <div v-if="error" class="card card-accent" data-accent="warning">
      <div class="row"><span class="chip" data-tone="warning">Нет данных</span><span>{{ error }}</span></div>
    </div>

    <template v-if="report">
      <section class="models">
        <article v-for="s in report.summary" :key="s.model" class="model-card" :data-provider="s.provider">
          <div class="model-head">
            <span class="provider" :data-provider="s.provider">{{ s.provider === 'cloud' ? 'Облако' : 'Локально' }}</span>
            <span class="model-name">{{ s.model }}</span>
          </div>

          <div class="criterion">
            <span class="criterion-name">Качество</span>
            <span class="criterion-main">{{ s.quality.answered }}/{{ s.quality.positive }}<small>ответов с цитатами</small></span>
            <div class="criterion-lines">
              <template v-if="s.quality.reviewed">сверка с эталоном: верно <b>{{ s.quality.correct }}</b> · частично <b>{{ s.quality.partial }}</b> · неверно <b>{{ s.quality.wrong }}</b><br></template>
              отклонено проверкой цитат <b>{{ s.quality.unverified }}</b> · «нет во фрагментах» <b>{{ s.quality.noAnswer }}</b><br>
              «не знаю» на посторонних <b>{{ s.quality.unknownOnNegative }}/{{ s.quality.negative }}</b>
            </div>
          </div>

          <div class="criterion">
            <span class="criterion-name">Скорость</span>
            <span class="criterion-main">{{ sec(s.speed.medianMs) }}<small>медиана ответа</small></span>
            <div class="criterion-lines">
              максимум <b>{{ sec(s.speed.maxMs) }}</b> · ответ ~<b>{{ Math.round(s.speed.medianCompletionTokens || 0) }}</b> ток.<br>
              <template v-if="s.speed.tokensPerSecondKind === 'generation'">
                генерация <b>{{ Math.round(s.speed.medianTokensPerSecond) }}</b> ток/с · промпт <b>{{ sec(s.speed.medianPromptMs) }}</b> ({{ Math.round(s.speed.medianPromptTokensPerSecond) }} ток/с)<br>
                холодная загрузка до <b>{{ sec(s.speed.maxLoadMs) }}</b>
              </template>
              <template v-else>сквозная скорость <b>{{ Math.round(s.speed.medianTokensPerSecond) }}</b> ток/с — с сетью и очередью провайдера</template>
            </div>
          </div>

          <div class="criterion">
            <span class="criterion-name">Стабильность</span>
            <span class="criterion-main">{{ s.stability.sameStatus }}/{{ s.stability.questions }}<small>одинаковый исход во всех прогонах</small></span>
            <div class="criterion-lines">
              слово в слово одинаковый ответ <b>{{ s.stability.sameText }}/{{ s.stability.questions }}</b><br>
              ошибок вызова <b>{{ s.stability.failed }}</b> · разброс времени на вопросе <b>{{ Math.round(s.stability.medianSpreadPercent || 0) }}%</b>
            </div>
          </div>
        </article>
      </section>

      <div class="retrieval">
        <span class="local-mark">● Поиск локально для всех моделей</span>
        <span>переформулировка запроса <b>{{ sec(report.retrievalSummary.medianRewriteMs) }}</b></span>
        <span>эмбеддинг + косинус + BGE <b>{{ sec(report.retrievalSummary.medianSearchMs) }}</b></span>
        <span>одни и те же фрагменты во всех прогонах <b>{{ report.retrievalSummary.sameFragments }}/{{ report.retrievalSummary.questions }}</b></span>
      </div>

      <section class="stack stack-sm">
        <div class="row-between" style="flex-wrap: wrap; gap: 8px">
          <div class="t-label-sm t-secondary">Каждый вопрос: исход прогонов слева направо и медианное время</div>
          <div class="legend">
            <span><i class="dot" data-s="answered"></i>ответ с цитатами</span>
            <span><i class="dot" data-s="no_answer"></i>«не знаю»</span>
            <span><i class="dot" data-s="unverified"></i>цитаты не подтвердились</span>
            <span><i class="dot" data-s="failed"></i>ошибка вызова</span>
          </div>
        </div>
        <div class="matrix-scroll"><table class="matrix">
          <thead><tr><th>№</th><th>Вопрос</th><th v-for="m in report.models" :key="m.model">{{ m.model }}</th></tr></thead>
          <tbody>
            <template v-for="q in report.questions" :key="q.id">
              <tr class="q-row" @click="toggle(q.id)">
                <td class="q-id">{{ q.id }}</td>
                <td class="q-text">{{ q.question }}<div class="q-expect">{{ q.expectAnswer ? 'ответ есть в корпусе' : 'ответа в корпусе нет — ждём «не знаю»' }}</div></td>
                <td v-for="m in report.models" :key="m.model" class="cell">
                  <span class="dots"><i v-for="a in answersOf(q.id, m.model)" :key="a.run" class="dot" :data-s="a.status" :title="'прогон ' + a.run + ': ' + a.status"></i></span>
                  <span class="cell-time">{{ medianTime(q.id, m.model) }}</span>
                </td>
              </tr>
              <tr v-if="open === q.id" class="details">
                <td :colspan="2 + report.models.length">
                  <div class="run-tabs">
                    <button v-for="run in report.runs" :key="run" class="btn btn-sm" :class="run === openRun ? 'btn-primary' : 'btn-secondary'" @click.stop="openRun = run">Прогон {{ run }}</button>
                  </div>
                  <div v-if="q.expectation" class="expectation"><b>Эталон:</b> {{ q.expectation }}</div>
                  <div class="detail-grid">
                    <div v-for="a in runAnswers(q.id, openRun)" :key="a.model" class="detail">
                      <div class="row" style="gap: 8px">
                        <span class="provider" :data-provider="a.provider">{{ a.model }}</span>
                        <i class="dot" :data-s="a.status"></i>
                        <span v-if="a.verdict" class="verdict" :data-v="a.verdict">{{ { correct: 'верно', partial: 'частично', wrong: 'неверно' }[a.verdict] }}</span>
                        <span v-if="a.llm" class="cell-time" style="margin-left: auto">{{ sec(a.llm.durationMs) }}</span>
                      </div>
                      <div class="detail-text">{{ a.answer }}</div>
                      <div class="detail-reason">{{ a.reason }}</div>
                      <div v-if="a.draft" class="draft">{{ a.draft }}</div>
                    </div>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table></div>
      </section>
    </template>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const report = ref(null);
    const error = ref('');
    const open = ref(null);
    const openRun = ref(1);
    let review = {};

    onMounted(async () => {
      const response = await fetch('/api/evaluation');
      const body = await response.json().catch(() => ({ message: `HTTP ${response.status}` }));
      if (!response.ok) { error.value = body.message; return; }
      report.value = body;
      review = body.review || {};
    });

    function answersOf(questionId, model) {
      return report.value.results.filter(r => r.questionId === questionId)
        .map(r => ({ run: r.run, ...(r.answers.find(a => a.model === model) || { status: 'failed' }) }));
    }

    function runAnswers(questionId, run) {
      const result = report.value.results.find(r => r.questionId === questionId && r.run === run);
      return (result?.answers || []).map(a => ({ ...a, verdict: review[a.model]?.[`${questionId}#${run}`] }));
    }

    function medianTime(questionId, model) {
      const times = answersOf(questionId, model).filter(a => a.llm).map(a => a.llm.durationMs).sort((a, b) => a - b);
      if (!times.length) return 'модель не вызывалась';
      const mid = Math.floor(times.length / 2);
      return sec(times.length % 2 ? times[mid] : (times[mid - 1] + times[mid]) / 2);
    }

    function toggle(id) { open.value = open.value === id ? null : id; openRun.value = 1; }
    function sec(ms) { return ms == null ? '—' : (ms / 1000).toFixed(1).replace('.', ',') + ' с'; }
    function dateTime(iso) { return new Date(iso).toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' }); }

    return { report, error, open, openRun, answersOf, runAnswers, medianTime, toggle, sec, dateTime };
  },
}).mount('#app');
</script>
</body>
</html>
