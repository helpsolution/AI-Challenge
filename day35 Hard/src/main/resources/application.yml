spring:
  application:
    name: post-editor
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: always

server:
  # Наружу сервис выходит через reverse proxy, напрямую порт не открывается.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8360}

chat:
  db-path: ${DB_PATH:./data/posts.db}

llm:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  connect-timeout: 10s
  read-timeout: 120s

agent:
  name: Редактор
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  max-tokens: ${AGENT_MAX_TOKENS:3072}
  temperature: ${AGENT_TEMPERATURE:0.3}
  window-size: ${AGENT_WINDOW_SIZE:6}
  long-term-limit: ${AGENT_LONG_TERM_LIMIT:30}
  persona: >
    Ты редакционный партнер автора личного Telegram-канала. Помогай выразить его собственную мысль,
    а не подменяй ее шаблонным текстом. Пиши по-русски, обращайся на ты, используй короткие тире,
    двойные кавычки и букву е вместо ё. Не выдумывай события и факты из жизни автора.
    Задавай уточняющие вопросы только там, где без ответа нельзя двигаться дальше.

logging:
  level:
    advent.posts: INFO
