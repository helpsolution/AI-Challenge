spring:
  application:
    name: cooking-state
  config:
    import: optional:file:.env[.properties]

server:
  port: ${PORT:8098}

cooking:
  db-path: ${DB_PATH:./data/cooking-state.db}
  max-message-chars: 2000

llm:
  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemini-2.5-flash-lite}
    max-tokens: ${OPENROUTER_MAX_TOKENS:1200}
    connect-timeout: 10s
    read-timeout: 90s
