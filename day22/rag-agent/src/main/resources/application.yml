spring:
  application:
    name: day22-rag-agent
  threads:
    virtual:
      enabled: true
  config:
    # Ключ DeepSeek лежит в day22/.env (в .gitignore); те же имена можно передать переменными окружения.
    import: optional:file:.env[.properties]

# Генеративная модель: отвечает на вопрос в обоих режимах, с одними и теми же параметрами.
llm:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  temperature: 0.2
  timeout: 120s

# Модель эмбеддингов: кодирует и чанки базы знаний, и вопрос.
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  # Первый запрос после простоя дольше: Ollama заново поднимает модель в память.
  timeout: 60s
  # nomic-embed-text обучали с префиксами задачи: то, по чему ищут, и то, что ищут, кодируются по-разному.
  document-prefix: "search_document: "
  query-prefix: "search_query: "

knowledge:
  # Markdown-документы с необязательной шапкой YAML (title, url).
  corpus-dir: data/corpus
  # База знаний: чанки, их векторы и метаданные. Собирается при первом запуске, если файла нет.
  index-file: data/index/knowledge.db
  # Фиксированный размер чанка и перекрытие, в символах.
  chunk-size: 500
  overlap: 50

retrieval:
  # Сколько самых похожих чанков уходит в промпт.
  top-k: 5

eval:
  # Контрольные вопросы с ожиданиями и источниками; отчёт прогона пишется рядом.
  questions-file: data/eval/questions.json
  report-file: data/eval/report.md

server:
  # Только localhost: агент нужен одному человеку в браузере.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8240}

logging:
  level:
    advent.rag: INFO
