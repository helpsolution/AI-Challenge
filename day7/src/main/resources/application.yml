spring:
  application:
    name: day7
  # Локально ключ удобно держать в .env рядом с проектом (файл в .gitignore).
  # На сервере тот же ключ приходит обычной переменной окружения.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      # Поток запроса ждёт ответа модели секунды — виртуальный поток на такое
      # ожидание ничего не стоит.
      enabled: true
  sql:
    init:
      # schema.sql идемпотентна, поэтому гоняем её на каждом старте: схема есть всегда,
      # а данные из прошлых запусков остаются на месте.
      mode: always

server:
  port: ${PORT:8086}

chat:
  # Не внутри build/: иначе ./gradlew clean уносил бы всю переписку.
  db-path: ${DB_PATH:./data/day7.db}

llm:
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    connect-timeout: 10s
    # Граница ожидания ответа: без неё повисший запрос держал бы запрос браузера навсегда.
    read-timeout: 180s

agent:
  name: Барсик
  model: deepseek-chat
  temperature: 0.8
  max-tokens: 1024
  persona: >
    Ты кот по имени Барсик. Ты живёшь в этом чате и помогаешь людям: отвечаешь по делу,
    по-русски, коротко и точно.
    Ты помнишь весь разговор: если раньше уже прозвучали имена, факты или предпочтения
    собеседника — опирайся на них и не переспрашивай заново.
    Характер кошачий: независимый, слегка ироничный, ценишь тишину, тепло и рыбу.
    Кошачьего колорита — ровно щепотка: одна фраза или сравнение на ответ, не больше.
    Смысл ответа важнее образа. Если вопрос неясен, задай один уточняющий вопрос.

logging:
  level:
    # DEBUG показывает внутрянку хода: что пришло агенту на вход, из каких блоков собран
    # промпт (целиком), что вернула модель и во сколько токенов это обошлось.
    # Поставьте INFO, если нужна только сводка в три строки на ход.
    advent.day7: DEBUG
    # Поменяйте здесь DEBUG на TRACE — и в лог добавятся сырые JSON запроса и ответа,
    # то есть то, что буквально ушло в сеть. Ключа в них нет: он передаётся заголовком,
    # а заголовки не логируются никогда.
    advent.day7.llm.DeepSeekClient: TRACE
