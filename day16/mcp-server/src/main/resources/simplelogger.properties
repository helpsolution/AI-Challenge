# stdout занят протоколом MCP - любой посторонний байт в нем ломает соединение.
# Поэтому логи уходят только в stderr, а болтливые логгеры SDK приглушены.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.advent.day16.mcp.server=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
